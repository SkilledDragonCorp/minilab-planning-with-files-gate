name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

env:
  DISABLE_TELEMETRY: "1"
  DO_NOT_TRACK: "1"

jobs:
  lab:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup Python 3.12
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"

      - name: Install uv
        uses: astral-sh/setup-uv@d0cc045d04ccac9d8b7881df0226f9e82c39688e # v6
        with:
          enable-cache: true
          cache-dependency-glob: "uv.lock"

      - name: Setup Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: "1.3.1"

      - name: Sync lab deps
        run: uv sync --locked --group dev

      - name: Fetch upstream + install skill
        run: |
          bash scripts/fetch-upstream.sh
          bash scripts/install-skill.sh

      - name: Pytest
        run: uv run pytest -q

      - name: pip-audit
        run: uv run pip-audit

  upstream-pytest:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup Python 3.12
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"

      - name: Upstream pytest (verbatim tests.yml)
        run: bash scripts/upstream-pytest.sh

  upstream-vitest:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup Node 22
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: "22"

      - name: Upstream vitest cohort (verbatim tests.yml)
        run: bash scripts/upstream-vitest.sh

  security:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Vendor upstream for osv-scanner lockfiles
        run: bash scripts/fetch-upstream.sh

      - name: Install pinned gitleaks
        run: |
          GITLEAKS_VERSION=8.30.1
          GITLEAKS_SHA256=551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb
          curl -sSL "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz" -o gitleaks_8.30.1_linux_x64.tar.gz
          echo "${GITLEAKS_SHA256}  gitleaks_8.30.1_linux_x64.tar.gz" | sha256sum -c -
          tar -xzf gitleaks_8.30.1_linux_x64.tar.gz gitleaks
          chmod +x gitleaks

      - name: Gitleaks
        run: ./gitleaks detect --source . --redact --verbose --no-banner --config .gitleaks.toml

      - name: Install pinned osv-scanner
        run: |
          OSV_VERSION=2.7.0
          OSV_SHA256=160c6253e2922e9e0a6a9771c5c4c40a4b3c6090b34a3cdd5e80c96cc2e4218b
          curl -sSL "https://github.com/google/osv-scanner/releases/download/v${OSV_VERSION}/osv-scanner_linux_amd64" -o osv-scanner
          echo "${OSV_SHA256}  osv-scanner" | sha256sum -c -
          chmod +x osv-scanner

      - name: osv-scanner on upstream package-lock.json files
        run: |
          ./osv-scanner scan --config osv-scanner.toml \
            --lockfile vendor/planning-with-files/.pi/skills/planning-with-files/extensions/planning-with-files/package-lock.json \
            --lockfile vendor/planning-with-files/.opencode/packages/opencode-planning-with-files/package-lock.json \
            --lockfile vendor/planning-with-files/.dsh/packages/dsh-planning-with-files/package-lock.json

      - name: Setup Bun (skill install for frontmatter check)
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: "1.3.1"

      - name: Install skill + lab skill frontmatter
        run: |
          bash scripts/install-skill.sh
          python3 - <<'PY'
          from pathlib import Path
          import sys

          root = Path(".")
          for rel in (
              ".claude/skills/planning-with-files/SKILL.md",
              ".claude/skills/plan-survives-clear/SKILL.md",
          ):
              path = root / rel
              text = path.read_text(encoding="utf-8")
              if not text.startswith("---\n"):
                  print(f"missing frontmatter: {rel}", file=sys.stderr)
                  sys.exit(1)
              end = text.find("\n---\n", 4)
              body = text[4:end]
              keys = {}
              for line in body.splitlines():
                  if ":" in line and not line.startswith(" ") and not line.startswith("-"):
                      k, _, v = line.partition(":")
                      keys[k.strip()] = v.strip().strip('"').strip("'")
              if not keys.get("name") or not keys.get("description"):
                  print(f"frontmatter incomplete: {rel} keys={keys!r}", file=sys.stderr)
                  sys.exit(1)
              print(f"OK {rel}: name={keys['name']!r}")
          PY

      - name: No forbidden skill mirrors
        run: test ! -e .cursor/skills && test ! -e .agents/skills
